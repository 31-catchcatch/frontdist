<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="캐치캐치 관리자 · 메인 배너 관리">
  <title>배너 관리 · 캐치캐치 관리자</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="stylesheet" href="css/admin-banners.css">
  <script src="js/admin-auth.js"></script>
  <script>AdminAuth.requireLogin();</script>
</head>
<body>
  <header class="admin-bar">
    <a class="admin-brand" href="admin-dashboard.html">캐치캐치 <span>ADMIN</span></a>
    <nav aria-label="관리자 메뉴">
      <a href="admin-dashboard.html">대시보드</a>
      <a href="admin-users.html">사용자</a>
      <a href="admin-products.html">상품</a>
      <a href="admin-seller-applications.html">입점심사</a>
      <a href="admin-sellers.html">입점업체</a>
      <a href="admin-coupons.html">쿠폰</a>
      <a href="admin-points.html">포인트</a>
      <a class="is-current" href="admin-banners.html">배너</a>
      <a href="admin-qna.html">Q&amp;A</a>
      <a href="admin-inquiries.html">1:1 문의</a>
      <a href="admin-settlements.html">정산</a>
    </nav>
    <div class="admin-actions">
      <a href="index.html">쇼핑몰 보기</a>
      <a href="admin-login.html" data-admin-logout>로그아웃</a>
    </div>
  </header>

  <main class="admin-page wrap">
    <div class="page-head">
      <div>
        <p class="kicker">BANNER MANAGEMENT</p>
        <h1>배너 관리</h1>
        <p class="desc">메인 페이지 상단 슬라이더에 노출되는 프로모션 배너를 조회하고 관리합니다.</p>
      </div>
      <span class="preview-badge" id="apiBadge">배너 API 확인 중…</span>
    </div>

    <!-- 관리자 배너 API 가 없을 때만 표시된다 (js/admin-banners.js 의 applyMode) -->
    <div class="api-notice" id="apiNotice" role="status" hidden></div>

    <div class="toolbar">
      <label class="search-box">
        <svg class="icn" viewBox="0 0 24 24" style="width:15px;height:15px"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
        <input type="text" id="q" placeholder="배너명·링크 검색">
      </label>
      <select id="statusFilter" hidden>
        <option value="">전체 상태</option>
        <option value="ok">노출중</option>
        <option value="wait">예약</option>
        <option value="stop">중지</option>
        <option value="done">종료</option>
      </select>
      <button type="button" class="btn sm" id="reloadBtn">새로고침</button>
      <button type="button" class="btn sm primary" id="createBtn">배너 등록</button>
      <span class="count">총 <b id="count">0</b>건</span>
    </div>

    <div class="table-wrap">
      <table class="data" id="bannerTable">
        <thead>
          <tr>
            <th class="num">순서</th>
            <th>이미지</th>
            <th class="grow">배너명</th>
            <th>연결 링크</th>
            <th class="col-admin-only">상태</th>
            <th class="col-admin-only">노출기간</th>
            <th>관리</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>

    <div class="pager">
      <button type="button">‹</button>
      <button type="button" class="on">1</button>
      <button type="button">›</button>
    </div>
  </main>

  <script src="js/admin-ui.js"></script>
  <script src="js/admin-api.js"></script>
  <script src="js/admin-banners.js"></script>
</body>
</html>
